<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel da ASCOM | Banco de fontes</title>
<style>
  :root { --bg:#edefec; --card:#fffffc; --texto:#1f2a24; --muted:#5d6a63; --borda:#cfd6d1; --verde:#14763c; --verde-escuro:#0e5a2d; --tag-bg:#e2f4e7; --tag-cor:#14763c; --erro:#b3261e; --sombra:0 1px 3px rgba(20,40,28,.12),0 6px 18px rgba(20,40,28,.06); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#101512; --card:#18201b; --texto:#e6ece8; --muted:#9fada5; --borda:#2f3b34; --verde:#4fbf79; --verde-escuro:#3aa563; --tag-bg:#1d3626; --tag-cor:#8be0a8; --erro:#ffb4ab; --sombra:0 1px 3px rgba(0,0,0,.5); } }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--texto); line-height:1.45; }
  button,input,select { font:inherit; color:inherit; }
  :focus-visible { outline:3px solid #f5c518; outline-offset:2px; }
  header { background:var(--card); border-bottom:1px solid var(--borda); padding:16px 20px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:1.2rem; color:var(--verde); }
  header p { color:var(--muted); font-size:.88rem; }
  main { max-width:1100px; margin:0 auto; padding:20px; }
  .caixa { background:var(--card); border-radius:12px; padding:22px; box-shadow:var(--sombra); }
  .login { max-width:380px; margin:48px auto; }
  .login h2 { font-size:1.1rem; margin-bottom:12px; }
  label { display:block; font-weight:600; font-size:.9rem; margin:10px 0 4px; }
  input[type=password], input[type=search], select { width:100%; padding:11px 12px; border:1px solid var(--borda); border-radius:8px; background:var(--card); min-height:44px; }
  .btn { border:1px solid var(--borda); background:var(--card); padding:10px 16px; border-radius:8px; font-weight:600; cursor:pointer; }
  .btn:hover { border-color:var(--verde); }
  .btn.pri { background:var(--verde); border-color:var(--verde); color:#fff; }
  .btn.pri:hover { background:var(--verde-escuro); }
  .btn.perigo { color:var(--erro); }
  .btn:disabled { opacity:.6; cursor:not-allowed; }
  .erro { color:var(--erro); font-size:.9rem; margin-top:10px; min-height:1.2em; }
  .abas { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .aba { border:1px solid var(--borda); background:var(--card); padding:9px 14px; border-radius:999px; cursor:pointer; font-weight:600; font-size:.9rem; }
  .aba[aria-selected="true"] { background:var(--tag-bg); color:var(--tag-cor); border-color:var(--verde); }
  .aba .n { opacity:.75; margin-left:4px; }
  .lista { display:grid; gap:14px; }
  .item { background:var(--card); border-radius:12px; padding:18px; box-shadow:var(--sombra); }
  .item h3 { font-size:1.05rem; }
  .item .un { color:var(--muted); font-size:.88rem; }
  .linha { margin-top:8px; font-size:.92rem; }
  .linha b { color:var(--muted); font-weight:600; }
  .selo { display:inline-block; font-size:.78rem; font-weight:700; padding:2px 10px; border-radius:999px; background:var(--tag-bg); color:var(--tag-cor); margin-left:8px; vertical-align:middle; }
  .acoes { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
  .barra { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .barra input { flex:1; min-width:220px; }
  table { width:100%; border-collapse:collapse; background:var(--card); border-radius:12px; overflow:hidden; box-shadow:var(--sombra); font-size:.9rem; }
  th,td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--borda); }
  th { color:var(--muted); font-size:.8rem; text-transform:uppercase; letter-spacing:.03em; }
  .vazio { color:var(--muted); text-align:center; padding:28px; }
  .tabela-wrap { overflow-x:auto; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <div><h1>Painel da ASCOM</h1><p>Banco de fontes da Unifesspa. Uso interno, com dados de contato.</p></div>
  <button class="btn" id="sair" hidden>Sair</button>
</header>
<main>
  <form class="caixa login" id="login" autocomplete="off">
    <h2>Entrar</h2>
    <label for="senha">Senha</label>
    <input type="password" id="senha" autocomplete="current-password" required>
    <p class="erro" id="erro-login" role="alert"></p>
    <button class="btn pri" id="entrar" type="submit" style="width:100%;margin-top:8px">Entrar</button>
  </form>

  <section id="app" hidden>
    <div class="abas" id="abas" role="tablist"></div>
    <div id="conteudo"></div>
  </section>
</main>

<script>
(function () {
  'use strict';
  var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxW01pH41uKNRlaGUuZdad0S18fUPw6sFqPlm5HOLWKz88flipGNyW_2Ro1sGtR356cbw/exec';
  var $ = function (id) { return document.getElementById(id); };
  var senha = '';       // só em memória; recarregar a página exige entrar de novo
  var dados = null;
  var aba = 'aprovar';

  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function norm(s) { return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  function seguroHref(u) { try { var x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch (e) { return ''; } }
  function dt(iso) { var d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }); }

  function chamar(corpo) {
    corpo.senha = senha;
    return fetch(APPS_SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(corpo) }).then(function (r) { return r.json(); });
  }

  $('login').addEventListener('submit', function (e) {
    e.preventDefault();
    senha = $('senha').value;
    $('erro-login').textContent = '';
    $('entrar').disabled = true;
    carregar().then(function (ok) {
      $('entrar').disabled = false;
      if (ok) { $('senha').value = ''; $('login').hidden = true; $('app').hidden = false; $('sair').hidden = false; desenhar(); }
      else senha = '';
    });
  });
  $('sair').addEventListener('click', function () { senha = ''; dados = null; location.reload(); });

  function carregar() {
    return chamar({ acao: 'painel' }).then(function (r) {
      if (r.status !== 'ok') { $('erro-login').textContent = r.msg || 'Não foi possível entrar.'; if ($('app').hidden === false) alert(r.msg || 'Erro'); return false; }
      dados = r; return true;
    }).catch(function () { $('erro-login').textContent = 'Falha de conexão.'; return false; });
  }

  var ABAS = [
    { id: 'aprovar', nome: 'Para aprovar', filtro: function (c) { return c.status === 'aguardando_ascom'; } },
    { id: 'publicados', nome: 'Publicados', filtro: function (c) { return c.status === 'aprovado'; } },
    { id: 'email', nome: 'Aguardando e-mail', filtro: function (c) { return c.status === 'aguardando_email'; } },
    { id: 'recusas', nome: 'Não querem participar', filtro: function (c) { return c.status === 'recusou'; } },
    { id: 'convite', nome: 'Ainda não responderam', filtro: null }
  ];

  function contar(a) {
    if (a.id === 'convite') return dados.sigaa.filter(function (x) { return x.situacao === 'novo'; }).length;
    return dados.cadastros.filter(a.filtro).length;
  }

  function desenhar() {
    var bar = $('abas'); bar.textContent = '';
    ABAS.forEach(function (a) {
      var b = el('button', 'aba'); b.type = 'button'; b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', a.id === aba ? 'true' : 'false');
      b.appendChild(document.createTextNode(a.nome)); b.appendChild(el('span', 'n', '(' + contar(a) + ')'));
      b.addEventListener('click', function () { aba = a.id; desenhar(); });
      bar.appendChild(b);
    });
    var c = $('conteudo'); c.textContent = '';
    if (aba === 'convite') return desenharConvite(c);
    var def = ABAS.filter(function (a) { return a.id === aba; })[0];
    var itens = dados.cadastros.filter(def.filtro).sort(function (a, b) { return a.criado_em < b.criado_em ? 1 : -1; });
    if (!itens.length) { c.appendChild(el('div', 'caixa vazio', 'Nada por aqui.')); return; }
    var l = el('div', 'lista');
    itens.forEach(function (i) { l.appendChild(item(i)); });
    c.appendChild(l);
  }

  function linha(rot, val) { var p = el('p', 'linha'); p.appendChild(el('b', null, rot + ': ')); p.appendChild(document.createTextNode(val || 'não informado')); return p; }

  function item(i) {
    var box = el('article', 'item');
    var h = el('h3', null, i.nome); if (i.status === 'aprovado') h.appendChild(el('span', 'selo', 'publicado'));
    box.appendChild(h);
    box.appendChild(el('div', 'un', [i.unidade, i.campus, 'SIAPE ' + i.siape].filter(Boolean).join(' · ')));
    if (i.status !== 'recusou') {
      box.appendChild(linha('Apresentação', i.resumo));
      box.appendChild(linha('Temas', i.temas));
      box.appendChild(linha('Formatos', i.formatos));
      box.appendChild(linha('Formação', (i.formacoes || []).map(function (f) { return f.nivel + ' em ' + f.curso + ' (' + f.instituicao + (f.ano ? ', ' + f.ano : '') + ')'; }).join('; ')));
      var p = el('p', 'linha'); p.appendChild(el('b', null, 'E-mail (confira se combina com o nome): '));
      p.appendChild(document.createTextNode(i.email || 'não informado')); box.appendChild(p);
      box.appendChild(linha('WhatsApp', i.whatsapp));
      var lh = seguroHref(i.lattes);
      var pl = el('p', 'linha'); pl.appendChild(el('b', null, 'Lattes: '));
      if (lh) { var a = el('a', null, lh); a.href = lh; a.target = '_blank'; a.rel = 'noopener noreferrer'; pl.appendChild(a); } else pl.appendChild(document.createTextNode('não informado'));
      box.appendChild(pl);
      if (i.observacao) box.appendChild(linha('Observação do docente', i.observacao));
    }
    box.appendChild(linha('Enviado em', dt(i.criado_em)));
    var ac = el('div', 'acoes');
    if (i.status === 'aguardando_ascom') {
      ac.appendChild(botao('Aprovar e publicar', 'pri', function () { decidir(i, 'aprovar', 'Publicar o cartão de ' + i.nome + ' no site?'); }));
      ac.appendChild(botao('Rejeitar', 'perigo', function () { decidir(i, 'rejeitar', 'Rejeitar o cadastro de ' + i.nome + '?'); }));
    } else if (i.status === 'aprovado') {
      ac.appendChild(botao('Retirar do site', 'perigo', function () { decidir(i, 'retirar', 'Retirar ' + i.nome + ' do site?'); }));
    }
    if (ac.childNodes.length) box.appendChild(ac);
    return box;
  }

  function botao(txt, cls, fn) { var b = el('button', 'btn ' + cls, txt); b.type = 'button'; b.addEventListener('click', fn); return b; }

  function decidir(i, decisao, pergunta) {
    if (!confirm(pergunta)) return;
    document.querySelectorAll('.acoes .btn').forEach(function (b) { b.disabled = true; });
    chamar({ acao: 'moderar', id: i.id, decisao: decisao }).then(function (r) {
      if (r.status !== 'ok') { alert(r.msg || 'Não foi possível concluir.'); }
      return carregar();
    }).then(function () { desenhar(); }).catch(function () { alert('Falha de conexão.'); desenhar(); });
  }

  function desenharConvite(c) {
    var lista = dados.sigaa.filter(function (x) { return x.situacao === 'novo'; });
    var barra = el('div', 'barra');
    var busca = el('input'); busca.type = 'search'; busca.placeholder = 'Filtrar por nome ou unidade'; busca.setAttribute('aria-label', 'Filtrar');
    var exp = botao('Baixar lista (CSV)', '', function () { exportar(atuais); });
    barra.appendChild(busca); barra.appendChild(exp); c.appendChild(barra);
    c.appendChild(el('p', 'un', 'Docentes da lista do SIGAA que ainda não se cadastraram nem disseram que não querem participar. Use para decidir quem receber o convite.'));
    var wrap = el('div', 'tabela-wrap'); c.appendChild(wrap);
    var atuais = lista;
    function mostrar() {
      var q = norm(busca.value.trim());
      atuais = lista.filter(function (x) { return !q || norm(x.nome + ' ' + x.unidade).indexOf(q) >= 0; });
      wrap.textContent = '';
      var t = el('table'); var th = el('thead'); var tr = el('tr');
      ['Nome', 'SIAPE', 'Unidade'].forEach(function (x) { tr.appendChild(el('th', null, x)); }); th.appendChild(tr); t.appendChild(th);
      var tb = el('tbody');
      atuais.forEach(function (x) { var r = el('tr'); [x.nome, x.siape, x.unidade].forEach(function (v) { r.appendChild(el('td', null, v)); }); tb.appendChild(r); });
      t.appendChild(tb); wrap.appendChild(t);
      if (!atuais.length) wrap.appendChild(el('div', 'vazio', 'Nenhum docente nesta lista.'));
    }
    busca.addEventListener('input', mostrar); mostrar();
  }

  function exportar(lista) {
    function cel(v) { v = String(v); if (/^[=+\-@]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; }
    var linhas = ['nome,siape,unidade'].concat(lista.map(function (x) { return [x.nome, x.siape, x.unidade].map(cel).join(','); }));
    var blob = new Blob(['﻿' + linhas.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'docentes-sem-resposta.csv';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }
})();
</script>
</body>
</html>
