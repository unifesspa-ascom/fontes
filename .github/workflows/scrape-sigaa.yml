name: Atualizar lista de docentes SIGAA

# Desativado em 05/11/2026: este workflow publicava dados/docentes-sigaa.json
# (nome e SIAPE de 499 docentes) direto no repositório público. O painel da
# ASCOM já não depende mais desse arquivo (busca a lista do SIGAA pelo Apps
# Script, autenticado por senha). Antes de reativar a atualização automática,
# decidir onde essa lista deve ficar guardada sem expor os dados publicamente
# (ex.: aba de uma planilha privada, lida pelo próprio Apps Script).

on:
  workflow_dispatch:        # só execução manual; sem agendamento automático

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests beautifulsoup4 lxml

      - name: Rodar o scraper (resultado não é publicado)
        run: python scripts/scrape_sigaa.py
