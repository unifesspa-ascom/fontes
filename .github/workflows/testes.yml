name: Testes do Banco de Fontes
on:
  push:
    branches:
      - main
      - fix/fluxo-cadastro-confirmacao-20261121
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe e regressões
        run: |
          node --check apps-script.js
          node --test tests/*.test.cjs
